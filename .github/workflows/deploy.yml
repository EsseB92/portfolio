name: Build & deploy vers Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Export statique + FTPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (historique complet pour les lastmod du sitemap)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (export statique dans out/)
        run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Déploiement FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # Répertoire distant vu depuis le compte FTP (souvent ./public_html/ ou ./)
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          # Le fichier d'état évite de tout renvoyer à chaque déploiement
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
